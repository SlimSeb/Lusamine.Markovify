name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lusamine.Markovify.slnx

      - name: Build
        run: dotnet build Lusamine.Markovify.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Lusamine.Markovify.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
